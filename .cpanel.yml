---
deployment:
  tasks:
    - export DEPLOYPATH=/home/sophonte/portusforwarders.com/
    - mkdir -p $DEPLOYPATH
    - mkdir -p $DEPLOYPATH/assets
    - mkdir -p $DEPLOYPATH/css
    - mkdir -p $DEPLOYPATH/images
    - mkdir -p $DEPLOYPATH/js
    - cp -R portus-forwarders/assets/. $DEPLOYPATH/assets/
    - cp -R portus-forwarders/css/. $DEPLOYPATH/css/
    - cp -R portus-forwarders/images/. $DEPLOYPATH/images/
    - cp -R portus-forwarders/js/. $DEPLOYPATH/js/
    - cp -R portus-forwarders/*.html $DEPLOYPATH